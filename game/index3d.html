<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORAL BAY HEAT — 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101b20; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* ---- F4-S3 HUD + menus: chunky dark translucent panels, coral /
     teal accents, bold condensed system type. ---- */
  #hud3d, .menu-overlay { font-family: "Arial Narrow", "Segoe UI", Arial, sans-serif; color: #eef4f2;
    -webkit-user-select: none; user-select: none; }
  /* No full-screen root layer: in software compositing a 100% overlay
     costs a full framebuffer blend per frame. Each cluster below is
     position:fixed on its own small layer instead. */
  #hud3d { pointer-events: none; }
  .hud-panel { background: rgba(8, 16, 20, 0.78); border-left: 4px solid #ff735d;
    border-top: 1px solid rgba(46, 196, 182, 0.5); padding: 8px 12px; margin-bottom: 8px; }
  .hud-big { font-weight: 800; font-size: 17px; letter-spacing: 1px; color: #ffd9d0; }
  .hud-line { font-size: 14px; font-weight: 600; letter-spacing: 0.4px; color: #cfe3de; margin-top: 2px; }
  .hud-tl { position: fixed; top: 14px; left: 14px; width: 300px; }
  .hud-timer { font-size: 34px; font-weight: 900; color: #ffd23e; letter-spacing: 2px; line-height: 1; margin-top: 4px; }
  .hud-response { border-left-color: #2e6bff; }
  .hud-searching { color: #ffd23e; animation: hud-pulse 0.8s infinite alternate; }
  @keyframes hud-pulse { from { opacity: 0.35; } to { opacity: 1; } }
  .hud-tr { position: fixed; top: 14px; right: 16px; text-align: right; width: 260px; }
  .hud-money { font-size: 34px; font-weight: 900; color: #7ee787; letter-spacing: 1px; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
  .hud-stars { font-size: 26px; letter-spacing: 3px; line-height: 1.1; }
  .hud-barwrap { height: 6px; background: rgba(255,255,255,0.18); margin-top: 4px; }
  .hud-bar { height: 100%; background: #2ec4b6; width: 0%; transition: width 0.3s; }
  .hud-healthwrap { margin-bottom: 6px; }
  .hud-health { background: #7ee787; }
  .hud-mmwrap { position: fixed; left: 14px; bottom: 14px; background: rgba(8,16,20,0.78);
    border: 2px solid rgba(46,196,182,0.55); padding: 4px; }
  .hud-minimap { display: block; width: 200px; height: 150px; }
  .hud-north { position: absolute; top: 6px; right: 9px; font-weight: 900; font-size: 13px; color: #fff;
    text-shadow: 0 0 4px #000; z-index: 2; }
  .hud-br { position: fixed; right: 16px; bottom: 14px; width: 250px; text-align: right; }
  .hud-speed { font-size: 40px; font-weight: 900; color: #fff; line-height: 1; letter-spacing: 1px; }
  .hud-weapons { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; }
  .hud-slot { background: rgba(8,16,20,0.78); border: 1px solid rgba(255,255,255,0.35);
    padding: 6px 10px; font-weight: 800; font-size: 14px; letter-spacing: 1px; }
  .hud-slot-on { border-color: #ff735d; color: #ffd9d0; box-shadow: inset 0 0 0 1px #ff735d; }
  .hud-slot-dim { opacity: 0.45; }
  .hud-radio { margin-top: 6px; display: inline-block; background: rgba(46,196,182,0.85); color: #06231f;
    font-weight: 800; font-size: 13px; padding: 5px 10px; border-radius: 999px; max-width: 250px; }
  .hud-dialogue { position: fixed; left: 50%; bottom: 86px; transform: translateX(-50%); width: 560px;
    max-width: 86vw; background: rgba(8,16,20,0.85); border-bottom: 3px solid #ff735d; padding: 10px 14px;
    display: flex; gap: 12px; align-items: flex-start; }
  .hud-chip { background: #ff735d; color: #1c0f0c; font-weight: 900; font-size: 13px; letter-spacing: 1px;
    padding: 4px 8px; white-space: nowrap; }
  .hud-dialogue .hud-line { font-size: 16px; color: #f2f7f5; margin-top: 0; }
  .hud-hint { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); font-size: 13px;
    font-weight: 700; letter-spacing: 1px; color: #d7e6e1; text-shadow: 0 1px 4px #000; transition: opacity 1.2s; }
  .hud-toasts { position: fixed; top: 26%; left: 0; right: 0; text-align: center; }
  .hud-toast { font-size: 30px; font-weight: 900; letter-spacing: 2px; color: #ffd23e;
    text-shadow: 0 3px 10px rgba(0,0,0,0.75); animation: hud-toast-in 0.25s; }
  .hud-toast-big { font-size: 46px; color: #ff735d; }
  .hud-toast-out { opacity: 0; transition: opacity 0.5s; }
  @keyframes hud-toast-in { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .hud-vignette { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 6; display: none;
    background: radial-gradient(ellipse at center, rgba(200,10,20,0) 52%, rgba(200,10,20,0.62) 100%); }

  /* ---- menus ---- */
  .menu-overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; }
  .menu-dim { background: rgba(5, 10, 13, 0.62); }
  .menu-title { background: linear-gradient(180deg, rgba(5,10,13,0.55), rgba(5,10,13,0.05) 45%, rgba(5,10,13,0.55)); cursor: pointer; }
  .menu-wordmark { font-family: Impact, "Arial Black", sans-serif; font-size: 84px; letter-spacing: 4px;
    color: #ff735d; text-shadow: 0 4px 0 #7a2415; line-height: 1; }
  .menu-subtitle { font-size: 20px; font-weight: 700; letter-spacing: 2px; color: #aef2e6; margin-top: 10px;
    text-shadow: 0 2px 8px #000; }
  .menu-save { font-size: 17px; font-weight: 800; letter-spacing: 1px; color: #ffd23e; margin-top: 14px; min-height: 20px; }
  .menu-controls { font-size: 15px; font-weight: 600; letter-spacing: 1px; color: #d7e6e1; margin-top: 26px; text-shadow: 0 1px 5px #000; }
  .menu-start { font-size: 24px; font-weight: 900; letter-spacing: 3px; color: #fff; margin-top: 14px;
    text-shadow: 0 2px 6px #000; }
  .menu-btn { pointer-events: auto; cursor: pointer; background: #ff735d; color: #1c0f0c; border: 0;
    font-family: inherit; font-size: 18px; font-weight: 900; letter-spacing: 2px; padding: 10px 26px; margin-top: 10px; }
  .menu-btn:hover { background: #ff8f7a; }
  .menu-btn-small { background: rgba(8,16,20,0.8); color: #ffd9d0; border: 1px solid #ff735d; font-size: 13px; padding: 6px 14px; }
  .menu-panel { width: 380px; max-width: 88vw; text-align: left; padding: 18px 20px; }
  .menu-panel-title { font-size: 24px; font-weight: 900; letter-spacing: 2px; color: #ffd9d0; }
  .menu-completion { font-size: 40px; font-weight: 900; color: #2ec4b6; letter-spacing: 1px; margin: 8px 0; }
  .menu-row { display: flex; justify-content: space-between; font-size: 16px; font-weight: 700;
    padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.14); color: #e6f0ec; }
  .menu-row b { color: #ffd23e; }
  .menu-endword { font-family: Impact, "Arial Black", sans-serif; font-size: 110px; letter-spacing: 8px; line-height: 1; }
  .menu-busted { background: rgba(10, 8, 20, 0.45); }
  .menu-busted::before, .menu-busted::after { content: ""; position: absolute; left: 0; right: 0; height: 26px;
    animation: hud-flashbars 0.5s infinite alternate; }
  .menu-busted::before { top: 0; background: #ff2e3e; }
  .menu-busted::after { bottom: 0; background: #2e6bff; }
  @keyframes hud-flashbars { from { opacity: 0.25; } to { opacity: 0.95; } }
  .menu-busted .menu-endword { color: #fff; text-shadow: 0 0 34px #2e6bff, 0 6px 0 rgba(255,46,62,0.8); }
  .menu-wasted { background: rgba(30, 2, 4, 0.55); }
  .menu-wasted .menu-endword { color: #c01824; text-shadow: 0 6px 30px rgba(0,0,0,0.9); }
</style>
</head>
<body>
<canvas id="game" aria-label="CORAL BAY HEAT 3D game"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<!-- Fase 4 game page: hand-rolled WebGL, classic scripts, no libraries.
     WASD/arrows drive or walk, Shift run, Space handbrake, F enter/exit car.
     ?shot=smoke freezes the composed golden-hour frame for capture. -->
<script src="./src/random.js"></script>
<script src="./src/gl.js"></script>
<script src="./src/city3d.js"></script>
<script src="./src/vehicles3d.js"></script>
<script src="./src/people3d.js"></script>
<script src="./src/traffic3d.js"></script>
<script src="./src/police3d.js"></script>
<script src="./src/combat3d.js"></script>
<script src="./src/missions3d.js"></script>
<script src="./src/save3d.js"></script>
<script src="./src/main3d.js"></script>
<script src="./src/hud3d.js"></script>
<script src="./src/menus3d.js"></script>
</body>
</html>
